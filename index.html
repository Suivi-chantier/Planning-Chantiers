<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Pas de maximum-scale ni user-scalable=no : iOS Safari zoom auto sur input <16px,
         et ces restrictions empêchent l'ouvrier de dézoomer ensuite. On laisse le zoom libre. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080a0d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Profero Planning" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- Barlow Condensed : police utilisée partout dans l'UI. Sans ce chargement,
         les Android (pas d'Arial Narrow installé) tombent sur un fallback large
         qui casse la mise en page (chips qui débordent, titres sur 2 lignes…). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <title>Profero · Planning</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Filet anti-écran-blanc (PWA). Symptôme vécu le 2026-07-29 : un service
         worker/cache périmé sert un index.html dont le bundle hashé n'existe
         plus sur Vercel ; la requête retombe sur le fallback HTML ("Expected a
         JavaScript module... MIME text/html") et PLUS AUCUN JS ne s'exécute —
         l'appli ne peut donc pas s'auto-réparer. Ce script inline (donc
         toujours exécuté, même quand le bundle ne charge pas) détecte l'échec
         de chargement d'un script /assets/, purge service workers + caches et
         recharge UNE seule fois (garde sessionStorage anti-boucle). -->
    <script>
      (function () {
        var CLE = "pwa_recovery_at";
        window.addEventListener("error", function (e) {
          var el = e.target;
          if (!el || el.tagName !== "SCRIPT" || !el.src) return;
          if (el.src.indexOf("/assets/") === -1) return;
          var dernier = 0;
          try { dernier = parseInt(sessionStorage.getItem(CLE), 10) || 0; } catch (_) {}
          if (Date.now() - dernier < 60 * 1000) return; // déjà tenté il y a < 1 min : on ne boucle pas
          try { sessionStorage.setItem(CLE, String(Date.now())); } catch (_) {}
          var nettoyages = [];
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            nettoyages.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister(); }));
              }).catch(function () {})
            );
          }
          if (window.caches && caches.keys) {
            nettoyages.push(
              caches.keys().then(function (cles) {
                return Promise.all(cles.map(function (c) { return caches.delete(c); }));
              }).catch(function () {})
            );
          }
          Promise.all(nettoyages).then(function () {
            window.location.reload();
          });
        }, true);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
