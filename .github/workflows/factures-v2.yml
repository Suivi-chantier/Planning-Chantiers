name: Factures v2 validation
on:
  pull_request:
    paths:
      - 'src/Renovation/RapprochementFactures.jsx'
      - 'src/Renovation/rapprochementFactures.mjs'
      - 'src/Renovation/PageEncoursFournisseurs.jsx'
      - 'src/Renovation/VueAchatsParMois.jsx'
      - 'src/Renovation/achatsParMois.mjs'
      - 'src/Renovation/encoursDoc.js'
      - 'scripts/verif-achats-par-mois.mjs'
      - 'tests/rapprochementFactures.test.mjs'
      - '.github/workflows/factures-v2.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/rapprochementFactures.test.mjs
      - name: Achats par mois de commande (module, données fictives)
        run: node scripts/verif-achats-par-mois.mjs
      - run: npm run build
