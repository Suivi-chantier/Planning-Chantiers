name: Factures v2 validation
on:
  pull_request:
    paths:
      - 'src/Renovation/RapprochementFactures.jsx'
      - 'src/Renovation/rapprochementFactures.mjs'
      - 'src/Renovation/PageEncoursFournisseurs.jsx'
      - 'src/Renovation/encoursFournisseursPageV1.mjs'
      - 'src/Renovation/encoursFournisseursDonnees.js'
      - 'src/Renovation/encoursFournisseursLecture.mjs'
      - 'src/Renovation/historiqueRapprochementV1.mjs'
      - 'src/Renovation/rapprochementDonnees.js'
      - 'src/Renovation/VueAchatsParMois.jsx'
      - 'src/Renovation/achatsParMois.mjs'
      - 'src/Renovation/encoursDoc.js'
      - 'scripts/verif-achats-par-mois.mjs'
      - 'tests/rapprochementFactures.test.mjs'
      - 'src/Renovation/saisieBlFacture.mjs'
      - 'src/Renovation/saisieBlFacture.js'
      - 'src/Renovation/ConfirmationLignesBl.jsx'
      - 'src/Renovation/CaptureCommandeMobile.jsx'
      - 'tests/saisieBlFacture.test.mjs'
      - 'src/Renovation/fraisGenerauxFactures.mjs'
      - 'src/Renovation/fraisGenerauxFactures.js'
      - 'src/Renovation/EtatsFinanciers.jsx'
      - 'tests/fraisGenerauxFactures.test.mjs'
      - 'supabase/functions/analyse-facture/**'
      - 'supabase/functions/analyse-commande/**'
      - '.github/workflows/factures-v2.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/rapprochementFactures.test.mjs
      - name: Saisie d'un BL depuis la facture (module, données fictives)
        run: node --test tests/saisieBlFacture.test.mjs
      - name: Frais généraux issus des factures (module, données fictives)
        run: node --test tests/fraisGenerauxFactures.test.mjs
      - name: Achats par mois de commande (module, données fictives)
        run: node scripts/verif-achats-par-mois.mjs
      - run: npm run build
