name: Fix Bibliotheque Default Dependency

on:
  push:
    branches: [feature/planning-model-v1]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[biblio-default-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/planning-model-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Aligner la Bibliothèque sur le défaut PARALLEL
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/Renovation/Bibliotheque.jsx')
          s = p.read_text()
          replacements = [
              ('const mode = st.dependance_mode || DEPENDANCE_MODES.SEQUENCE;',
               'const mode = st.dependance_mode || DEPENDANCE_MODES.PARALLEL;'),
              ('dependance_mode: DEPENDANCE_MODES.SEQUENCE, predecesseur_ids: [], delai_min_calendaire: 0, unite_delai: "heures"',
               'dependance_mode: DEPENDANCE_MODES.PARALLEL, predecesseur_ids: [], delai_min_calendaire: 0, unite_delai: "heures"'),
          ]
          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Motif attendu une fois, trouvé {count}: {old}')
              s = s.replace(old, new)
          p.write_text(s)
          PY
      - run: node scripts/verif-planning-model-v1.mjs
      - run: node scripts/verif-planning-model-audit-v1.mjs
      - run: node scripts/verif-planning-dependency-inference-v1.mjs
      - run: node scripts/verif-planning-eligibility-v1.mjs
      - run: npm ci
      - run: npm run build
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Renovation/Bibliotheque.jsx
          git commit -m "Aligne le défaut de dépendance Bibliothèque sur PARALLEL [biblio-default-generated]"
          git push origin HEAD:feature/planning-model-v1
