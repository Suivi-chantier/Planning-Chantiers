name: Alertes fiche sécurité — notifications S1 / S2 (7h35, jours ouvrés)

# Projet docs/projets/fiche-securite-chantier.md, tâche 7b.
# Créneau planifié : tenu par la BASE (job pg_cron « profero_push_alertes_securite »,
# supabase/migrations/*_securite_alertes_notifications.sql), pas par GitHub.
# Ce workflow ne sert qu'au lancement à la main.
#
# Bouton « Run workflow » : simulation cochée (par défaut) = liste de ce qui
# serait envoyé, sans rien envoyer ni écrire.
#
# Secret requis : CRON_SECRET (secret GitHub, pour le lancement à la main).

on:
  workflow_dispatch:
    inputs:
      simulation:
        description: "Simulation sans envoi ni écriture"
        type: boolean
        required: false
        default: true

jobs:
  alertes:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron-dispatcher?job=alertes_securite
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SIMULATION: ${{ github.event.inputs.simulation }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret manquant"
            exit 1
          fi
          if [ "$SIMULATION" = "true" ]; then
            job="alertes_securite&simulation=1"
          else
            job="alertes_securite"
          fi
          response=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://planning-chantiers.vercel.app/api/cron-dispatcher?job=$job")
          status=$(echo "$response" | grep -oE 'HTTP_STATUS:[0-9]+' | cut -d: -f2)
          body=$(echo "$response" | sed 's/HTTP_STATUS:[0-9]*$//')
          echo "Status: $status"
          echo "Body  : $body"
          if [ "$status" != "200" ]; then
            echo "::error::Le dispatcher a renvoyé un statut non-200"
            exit 1
          fi
          if echo "$body" | grep -q '"error":'; then
            echo "::error::Le job « alertes fiche sécurité » a échoué — voir le corps de la réponse"
            exit 1
          fi
