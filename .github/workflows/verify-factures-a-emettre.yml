name: Verify Facture à émettre (F1)

on:
  pull_request:
    paths:
      - 'src/Renovation/factureAEmettre.mjs'
      - 'src/Renovation/factureAEmettre.js'
      - 'src/Renovation/facturationClient.mjs'
      - 'src/Renovation/cycleVie.mjs'
      - 'src/Renovation/cycleVieReprise.mjs'
      - 'src/Renovation/PageChantiers.jsx'
      - 'src/chantierFinance.mjs'
      - 'src/avancementPondere.mjs'
      - 'src/phasesDefaut.mjs'
      - 'src/constants.js'
      - 'supabase/functions/_partage/notificationsPushV1.mjs'
      - 'supabase/migrations/*_notifications_etat.sql'
      - 'api/cron-dispatcher.js'
      - 'api/_cron/cron-factures-a-emettre.js'
      - 'api/_cron/cron-push-reportes.js'
      - '.github/workflows/cron-factures-a-emettre.yml'
      - 'scripts/verif-factures-a-emettre.mjs'
      - '.github/workflows/verify-factures-a-emettre.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Facture à émettre — détection partagée fiche / serveur, une notification F1 regroupée par jour, chaque échéance notifiée une fois (table d'état), aucun mail ni drapeau écrit par le job, migration additive (données fictives)
        run: node scripts/verif-factures-a-emettre.mjs
