name: Finalize Planning Resources V1

on:
  push:
    branches:
      - feature/planning-resources-v1
    paths:
      - 'scripts/finalize-planning-resources-v1.mjs'
      - '.github/workflows/finalize-planning-resources-v1.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message != 'Finalise les équipes et capacités Ressources V1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Appliquer les patches contrôlés
        run: node scripts/finalize-planning-resources-v1.mjs
      - name: Fixtures ressources
        run: node scripts/verif-planning-resource-model-v1.mjs
      - name: Fixtures capacité
        run: node --experimental-default-type=module scripts/verif-planning-resource-capacity-v1.mjs
      - name: Fixtures contraintes
        run: node --experimental-default-type=module scripts/verif-planning-constraint-model-v1.mjs
      - name: Installer les dépendances
        run: npm ci
      - name: Compiler l'application
        run: npm run build
      - name: Vérifier le diff
        run: git diff --check
      - name: Committer la finalisation
        run: |
          git config user.name "Suivi-chantier"
          git config user.email "suivi.chantier@groupe-profero.com"
          git add src/Renovation/Admin.jsx src/Renovation/CellModal.jsx
          if git diff --cached --quiet; then
            echo "Aucun changement à committer"
          else
            git commit -m "Finalise les équipes et capacités Ressources V1"
            git push
          fi
