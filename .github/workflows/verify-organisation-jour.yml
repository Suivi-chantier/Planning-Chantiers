name: Verify Organisation par jour (module pur, étape 1)

on:
  push:
    branches: [main]
    paths:
      - 'src/Renovation/organisationJour.mjs'
      - 'src/Renovation/organisationJour.js'
      - 'src/Renovation/Navigation.jsx'
      - 'src/Renovation/dateDuJour.js'
      - 'src/Renovation/MonOrganisation.jsx'
      - 'src/Renovation/Dashboard.jsx'
      - 'src/Renovation/blocsDuJour/**'
      - 'src/Renovation/ProfilNotifications.jsx'
      - 'src/App.jsx'
      - 'src/access.js'
      - 'scripts/verif-organisation-jour.mjs'
      - 'src/Renovation/BilanPeriode.jsx'
      - 'src/Renovation/bilanSemaineChiffresV1.mjs'
      - 'src/Renovation/bilanSemaineChiffresV1.js'
      - 'src/Renovation/bilanSemaineDonnees.js'
      - 'src/Renovation/bilanPeriodeV3.mjs'
      - 'src/Renovation/alertesMargesV2.mjs'
      - 'scripts/verif-bloc-bilan-semaine.mjs'
      - 'src/Renovation/commandesASaisirV1.mjs'
      - 'src/Renovation/commandesASaisirV1.js'
      - 'src/Renovation/commandesAPasserDonnees.js'
      - 'src/Renovation/commandesAPasserV1.mjs'
      - 'src/Renovation/PagePlanningCommandes.jsx'
      - 'scripts/verif-bloc-commandes-a-saisir.mjs'
      - '.github/workflows/verify-organisation-jour.yml'
  pull_request:
    paths:
      - 'src/Renovation/organisationJour.mjs'
      - 'src/Renovation/organisationJour.js'
      - 'src/Renovation/Navigation.jsx'
      - 'src/Renovation/dateDuJour.js'
      - 'src/Renovation/MonOrganisation.jsx'
      - 'src/Renovation/Dashboard.jsx'
      - 'src/Renovation/blocsDuJour/**'
      - 'src/Renovation/ProfilNotifications.jsx'
      - 'src/App.jsx'
      - 'src/access.js'
      - 'scripts/verif-organisation-jour.mjs'
      - 'src/Renovation/BilanPeriode.jsx'
      - 'src/Renovation/bilanSemaineChiffresV1.mjs'
      - 'src/Renovation/bilanSemaineChiffresV1.js'
      - 'src/Renovation/bilanSemaineDonnees.js'
      - 'src/Renovation/bilanPeriodeV3.mjs'
      - 'src/Renovation/alertesMargesV2.mjs'
      - 'scripts/verif-bloc-bilan-semaine.mjs'
      - 'src/Renovation/commandesASaisirV1.mjs'
      - 'src/Renovation/commandesASaisirV1.js'
      - 'src/Renovation/commandesAPasserDonnees.js'
      - 'src/Renovation/commandesAPasserV1.mjs'
      - 'src/Renovation/PagePlanningCommandes.jsx'
      - 'scripts/verif-bloc-commandes-a-saisir.mjs'
      - '.github/workflows/verify-organisation-jour.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Organisation par jour — ancien format inchangé, ordre du jour, page d'arrivée, blocs, « ordre habituel aujourd'hui », modèle Conducteur de travaux, barres de navigation, écran « Mon organisation », tableau de bord du jour (données fictives)
        run: node scripts/verif-organisation-jour.mjs
      - name: Bloc « Bilan de la semaine passée » — même chargement et même calcul que la page Bilan de semaine, aucune donnée, relevé absent (données fictives)
        run: node scripts/verif-bloc-bilan-semaine.mjs
      - name: Bloc « Commandes à saisir » — même lecture des demandes que le tableau de bord, mêmes chiffres que la page Commandes à passer, aucune demande, aucun article, erreurs (données fictives)
        run: node scripts/verif-bloc-commandes-a-saisir.mjs
