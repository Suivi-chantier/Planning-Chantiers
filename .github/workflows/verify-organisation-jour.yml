permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Organisation par jour — ancien format inchangé, ordre du jour, page d'arrivée, blocs, « ordre habituel aujourd'hui », modèle Conducteur de travaux, barres de navigation, écran « Mon organisation », tableau de bord du jour (données fictives)
        run: node scripts/verif-organisation-jour.mjs
      - name: Bloc « Bilan de la semaine passée » — même chargement et même calcul que la page Bilan de semaine, aucune donnée, relevé absent (données fictives)
        run: node scripts/verif-bloc-bilan-semaine.mjs
      - name: Bloc « Commandes à saisir » — même lecture des demandes que le tableau de bord, mêmes chiffres que la page Commandes à passer, aucune demande, aucun article, erreurs (données fictives)
        run: node scripts/verif-bloc-commandes-a-saisir.mjs
      - name: Bloc « Chantiers à venir » — statut « Planifié » de la fiche chantier, étapes de la Préparation évaluées comme sur la fiche, aucun chantier, Préparation non renseignée, erreurs (données fictives)
        run: node scripts/verif-bloc-chantiers-a-venir.mjs
      - name: Bloc « Administratif fournisseurs » — mêmes lectures et même calcul que les pages Rapprochement factures et Encours fournisseurs, aucune facture, aucun encours, erreur d'une partie (données fictives)
        run: node scripts/verif-bloc-administratif-fournisseurs.mjs
      - name: Bloc « Tournée des chantiers » — mêmes niveaux d'alerte que la page Alertes, mêmes retours que la page Retours du terrain, tâches de phasage en retard (règle existante), vides, relevé absent, erreur d'une partie (données fictives)
        run: node scripts/verif-bloc-tournee-chantiers.mjs
      - name: Bloc « Planning de la semaine suivante » — même lancement du moteur, même découpe et mêmes noms que la carte « La semaine qui vient » de la page Bilan de semaine, total, par chantier, par personne, aucune heure, erreur, ligne « Montant prévisionnel : fonctionnalité à venir » (données fictives)
        run: node scripts/verif-bloc-planning-semaine-suivante.mjs
      - name: Bloc « Matériaux à commander » — même rangement par semaine que la fenêtre « Commandes de la semaine » de la page Commandes à passer (onglet « Semaine prochaine »), même liste, par chantier, articles les plus urgents, aucun article, erreur, chargement, fuseau de Paris (données fictives)
        run: node scripts/verif-bloc-materiaux-a-commander.mjs
