name: Verify Planning Replanning V1

on:
  push:
    branches:
      - feature/planning-replanning-v1
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Replanning real state V1
        run: node scripts/verif-planning-replanning-state-v1.mjs
      - name: Replanning adapter bridge V1
        run: node scripts/verif-planning-replanning-adapter-v1.mjs
      - name: Replanning legacy ouvrage code V1
        run: node scripts/verif-planning-replanning-legacy-code-v1.mjs
      - name: Replanning forecast stability V1
        run: node scripts/verif-planning-replanning-stability-v1.mjs
      - name: Replanning site resolution V1
        run: node scripts/verif-planning-replanning-site-resolution-v1.mjs
      - name: Replanning multi-day continuity V1
        run: node scripts/verif-planning-replanning-multi-day-continuity-v1.mjs
      - name: Replanning forecast date stability V1
        run: node scripts/verif-planning-replanning-date-stability-v1.mjs
      - name: Replanning residual capacity diagnostic V1
        run: node scripts/verif-planning-replanning-capacity-diagnostic-v1.mjs
      - name: Replanning horizon sensitivity V1
        run: node scripts/verif-planning-replanning-horizon-sensitivity-v1.mjs
      - name: Replanning explainable diff V1
        run: node scripts/verif-planning-replanning-diff-v1.mjs
      - name: Replanning continuity diff V1
        run: node scripts/verif-planning-replanning-diff-continuity-v1.mjs
      - name: Replanning impact scope V1
        run: node scripts/verif-planning-replanning-impact-v1.mjs
      - name: Replanning incremental V1
        run: node scripts/verif-planning-replanning-incremental-v1.mjs
      - name: Replanning safe apply plan V1
        run: node scripts/verif-planning-replanning-apply-plan-v1.mjs
      - name: Replanning apply safety V1
        run: node scripts/verif-planning-replanning-apply-safety-v1.mjs
      - name: Replanning touched phasage guards V1
        run: node scripts/verif-planning-replanning-phasage-guards-v1.mjs
      - name: Replanning apply request V1
        run: node scripts/verif-planning-replanning-apply-request-v1.mjs
      - name: Replanning apply RPC contract V1
        run: node scripts/verif-planning-replanning-apply-rpc-v1.mjs
      - name: Planning fin previsionnelle V1
        run: node scripts/verif-planning-fin-previsionnelle-v1.mjs
      - name: Bilan semaine prochaine V1
        run: node scripts/verif-bilan-semaine-prochaine-v1.mjs
      - name: Points attention V1
        run: node scripts/verif-points-attention-v1.mjs
      - name: Suivi points attention V1
        run: node scripts/verif-suivi-points-attention-v1.mjs
      - name: Bilan semaine email V1
        run: node scripts/verif-bilan-semaine-email-v1.mjs
      - name: Echantillon cadences V1
        run: node scripts/verif-echantillon-cadences-v1.mjs
      - name: Bibliotheque proteger historique
        run: node scripts/verif-bibliotheque-proteger-historique.mjs
      - name: Bibliotheque archiver
        run: node scripts/verif-bibliotheque-archiver.mjs
      - name: Import bibliotheque materiaux (noms uniques)
        run: node scripts/verif-import-noms-uniques.mjs
      - name: Bibliotheque materiaux grand catalogue (lecture par tranches)
        run: node scripts/verif-materiaux-grand-catalogue.mjs
      - name: Alertes V1
        run: node scripts/verif-alertes-v1.mjs
      - name: Compte rendu client (gabarit PDF)
        run: node scripts/verif-compte-rendu-client-doc.mjs
      - name: Encours fournisseurs (gabarit PDF)
        run: node scripts/verif-encours-doc.mjs
      - name: Renovation copilot V1 (assistant IA, lecture seule)
        run: node scripts/verif-renovation-copilot-v1.mjs
      - name: Installer PGlite (PostgreSQL en mémoire, hors package.json)
        run: npm install --no-save --no-package-lock @electric-sql/pglite@0.5.8
      - name: Espace ouvrier - beta Mes phases (RPC + module, donnees fictives)
        run: node scripts/verif-ouvrier-mes-phases.mjs
      - name: Compte rendu - beta nouveau formulaire (non-regression v1, equivalence des pointages v1/v2)
        run: node scripts/verif-compte-rendu-v2.mjs
      - name: Taches hors devis (instantane reel anonymise, calculs identiques + taches marquees)
        run: node scripts/verif-hors-devis.mjs
      - name: Nouvelle tache proposee par l'ouvrier (creation a la validation, pointages, conflit de revision)
        run: node scripts/verif-nouvelle-tache.mjs
      - name: Quantites posees et photo apres (suivi en quantite, cumul, validation, SQL)
        run: node scripts/verif-quantites-posees.mjs
      - name: Planning engine V1 regression
        run: node scripts/verif-planning-engine-v1.mjs
      - name: Planning engine adapter V1 regression
        run: node scripts/verif-planning-engine-adapter-v1.mjs
      - name: Planning engine data V1 regression
        run: node scripts/verif-planning-engine-data-v1.mjs
      - name: Planning engine diff V1 regression
        run: node scripts/verif-planning-engine-diff-v1.mjs
      - name: Vite build
        run: npm run build
      - name: Diff check
        run: git diff --check