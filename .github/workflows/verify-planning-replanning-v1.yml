name: Verify Planning Replanning V1

on:
  push:
    branches:
      - feature/planning-replanning-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Replanning real state V1
        run: node scripts/verif-planning-replanning-state-v1.mjs
      - name: Replanning adapter bridge V1
        run: node scripts/verif-planning-replanning-adapter-v1.mjs
      - name: Replanning forecast stability V1
        run: node scripts/verif-planning-replanning-stability-v1.mjs
      - name: Replanning site resolution V1
        run: node scripts/verif-planning-replanning-site-resolution-v1.mjs
      - name: Replanning multi-day continuity V1
        run: node scripts/verif-planning-replanning-multi-day-continuity-v1.mjs
      - name: Replanning forecast date stability V1
        run: node scripts/verif-planning-replanning-date-stability-v1.mjs
      - name: Replanning explainable diff V1
        run: node scripts/verif-planning-replanning-diff-v1.mjs
      - name: Replanning continuity diff V1
        run: node scripts/verif-planning-replanning-diff-continuity-v1.mjs
      - name: Replanning impact scope V1
        run: node scripts/verif-planning-replanning-impact-v1.mjs
      - name: Replanning incremental V1
        run: node scripts/verif-planning-replanning-incremental-v1.mjs
      - name: Planning engine V1 regression
        run: node scripts/verif-planning-engine-v1.mjs
      - name: Planning engine adapter V1 regression
        run: node scripts/verif-planning-engine-adapter-v1.mjs
      - name: Planning engine data V1 regression
        run: node scripts/verif-planning-engine-data-v1.mjs
      - name: Planning engine diff V1 regression
        run: node scripts/verif-planning-engine-diff-v1.mjs
      - name: Vite build
        run: npm run build
      - name: Diff check
        run: git diff --check
      - name: Audit REST smoke
        env:
          SUPABASE_URL: https://yooksnzhlffqgpzkcjhl.supabase.co
          SUPABASE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlvb2tzbnpobGZmcWdwemtjamhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxMDAzMzIsImV4cCI6MjA4NzY3NjMzMn0.rpr3PgIvHOBchoMYhm-yfnmkD5lcz__tnSvRptIUMQ8
        run: |
          status=$(curl -sS -o /tmp/replanning-rest-smoke.json -w '%{http_code}' \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/planning_resources?select=id&limit=1")
          echo "Supabase REST status: $status"
          test "$status" = "200"
      - name: Upload audit source
        uses: actions/upload-artifact@v4
        with:
          name: replanning-audit-source
          path: |
            package.json
            package-lock.json
            src/Renovation
            src/rythmeSemaine.js
          retention-days: 1
