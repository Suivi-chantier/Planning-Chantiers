name: Verify Commandes à passer (page + notification C3)

on:
  pull_request:
    paths:
      - 'src/Renovation/commandesAPasserV1.mjs'
      - 'src/Renovation/commandesAPasserV1.js'
      - 'src/Renovation/commandesAPasserPushV1.mjs'
      - 'src/Renovation/commandesAPasserPushV1.js'
      - 'src/Renovation/commandesOuvrageV1.mjs'
      - 'src/Renovation/libellesPhasageV1.mjs'
      - 'src/chantierFinance.mjs'
      - 'src/Renovation/chantiersTables.mjs'
      - 'src/Renovation/chantierActif.mjs'
      - 'src/Renovation/PagePlanningCommandes.jsx'
      - 'supabase/functions/_partage/notificationsPushV1.mjs'
      - 'api/cron-dispatcher.js'
      - 'api/_cron/cron-push-materiaux.js'
      - 'api/_cron/cron-push-reportes.js'
      - 'api/_cron/cron-recap-commandes.js'
      - '.github/workflows/cron-push-materiaux.yml'
      - 'scripts/verif-commandes-a-passer.mjs'
      - '.github/workflows/verify-commandes-a-passer.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Commandes à passer — même liste pour la page et la notification C3, anti-répétition, récap du vendredi inchangé (données fictives)
        run: node scripts/verif-commandes-a-passer.mjs
