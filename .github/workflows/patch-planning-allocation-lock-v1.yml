name: Patch Planning Allocation Lock V1

on:
  push:
    branches:
      - feature/planning-baseline-v1
    paths:
      - 'scripts/patch-planning-allocation-lock-v1.mjs'
      - '.github/workflows/patch-planning-allocation-lock-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Appliquer le patch contrôlé
        run: node scripts/patch-planning-allocation-lock-v1.mjs
      - name: Fixtures baseline chantier 03
        run: node --experimental-default-type=module scripts/verif-planning-baseline-model-v1.mjs
      - name: Fixtures contraintes chantier 02
        run: node --experimental-default-type=module scripts/verif-planning-constraint-model-v1.mjs
      - name: Installer dépendances
        run: npm ci
      - name: Compiler l'application
        run: npm run build
      - name: Vérifier le diff
        run: git diff --check
      - name: Committer les verrous
        run: |
          git config user.name "Suivi-chantier"
          git config user.email "suivi.chantier@groupe-profero.com"
          git add src/Renovation/CellModal.jsx src/Renovation/Planning.jsx
          if git diff --cached --quiet; then
            echo "Aucun changement à committer"
          else
            git commit -m "Raccorde les verrous aux allocation_uid"
            git push
          fi
