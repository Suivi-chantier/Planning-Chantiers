name: Verify Fondations Finance

# Refonte du Bilan semaine, étape 1 (fondations des données financières).
# Déclenché sur toute PR (pas de filtre de branche : cf. piège des PR empilées).
on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # verif-chantier-finance-fixtures importe la transcription de référence,
      # qui charge @supabase/supabase-js (sans s'en servir hors connexion).
      - name: Installer les dependances
        run: npm ci
      - name: 1A - Taux de frais generaux unique et date (donnees fictives)
        run: node scripts/verif-fg-taux-date.mjs
      - name: 1B - Nature des couts et reste a commander par enveloppe de lot (donnees fictives)
        run: node scripts/verif-enveloppes-lots.mjs
      - name: Installer PGlite (PostgreSQL en memoire, hors package.json)
        run: npm install --no-save --no-package-lock @electric-sql/pglite@0.5.8
      - name: 1C - Journal d'avancement date et production exacte (SQL en memoire, donnees fictives)
        run: node scripts/verif-journal-avancement.mjs
      - name: 1D - Releves journaliers (completude, cascade, rattrapage de nuit, donnees fictives)
        run: node scripts/verif-releves-journaliers.mjs
      - name: Module chantierFinance - valeurs calculees a la main (donnees fictives)
        run: node scripts/verif-chantier-finance-fixtures.mjs
      - name: Etape 2 - Trois marges, marge probable, derive des lots (donnees fictives)
        run: node scripts/verif-trois-marges.mjs
      - name: Etape 2 - Nouvelles alertes des marges sur les releves journaliers (donnees fictives)
        run: node scripts/verif-alertes-marges.mjs
      - name: Etape 3 - Bilan d une periode, preselection, version direction (donnees fictives)
        run: node scripts/verif-bilan-periode.mjs
      - name: Etape 4 - Taches hors devis A / B / C (donnees fictives)
        run: node scripts/verif-hors-devis-v2.mjs
      - name: CR-2 - Libelles personnalises du phasage, libelle devis conserve (donnees fictives)
        run: node scripts/verif-libelles-phasage.mjs
