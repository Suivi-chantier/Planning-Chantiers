name: Temp Fix Planning Engine V1

on:
  push:
    branches:
      - feature/planning-engine-v1

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/planning-engine-v1
          fetch-depth: 0
      - name: Patch engine and fixtures
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/Renovation/planningEngineV1.js')
          s = p.read_text()
          old = 'function choisirEquipe({ travail, date, ressources, evenements, contraintes, charge }) {'
          new = 'function choisirEquipe({ travail, date, ressources, evenements, contraintes, charge, requiredElapsed = null }) {'
          assert s.count(old) == 1, 'signature choisirEquipe inattendue'
          s = s.replace(old, new)

          old = '    if (capacite.capacite_disponible <= EPS) continue;\n\n    const cEval = evaluerContraintesPlanning({'
          new = '    if (capacite.capacite_disponible <= EPS) continue;\n    if (!travail.fractionnable && requiredElapsed != null && capacite.capacite_disponible + EPS < requiredElapsed) continue;\n\n    const cEval = evaluerContraintesPlanning({'
          assert s.count(old) == 1, 'bloc capacite inattendu'
          s = s.replace(old, new)

          old = '''        const crew = choisirEquipe({
          travail: t,
          date,
          ressources: resourceList,
          evenements: evenementsRessources,
          contraintes: constraints,
          charge,
        });'''
          new = '''        const requiredElapsed = state.restant_mo / t.crew_size;
        const crew = choisirEquipe({
          travail: t,
          date,
          ressources: resourceList,
          evenements: evenementsRessources,
          contraintes: constraints,
          charge,
          requiredElapsed,
        });'''
          assert s.count(old) == 1, 'appel choisirEquipe inattendu'
          s = s.replace(old, new)

          old = '        const elapsed = round2(Math.min(maxElapsed, state.restant_mo / crew.selected.length));'
          new = '        const elapsed = round2(Math.min(maxElapsed, requiredElapsed));'
          assert s.count(old) == 1, 'calcul elapsed inattendu'
          s = s.replace(old, new)
          p.write_text(s)

          p = Path('scripts/verif-planning-engine-v1.mjs')
          s = p.read_text()
          old = 'assert.equal(/supabase/i.test(engineSource), false, "planningEngineV1 ne doit ni importer ni mentionner Supabase");'
          new = 'assert.equal(/(?:import|from)[^\\n]*supabase/i.test(engineSource), false, "planningEngineV1 ne doit pas importer Supabase");'
          assert s.count(old) == 1, 'assert Supabase inattendu'
          s = s.replace(old, new)

          marker = '// 18. Déterminisme : mêmes entrées, même proposition bit-à-bit.\n'
          assert s.count(marker) == 1, 'marqueur test 18 introuvable'
          test = '''// 18. Une tâche non fractionnable attend un créneau complet au lieu d’être découpée.\n{\n  const out = run({\n    travaux: [task("NF", 5, { fractionnable: false })],\n    allocationsExistantes: [{\n      allocation_uid: "EX-NF", chantier_id: "chantier-Z", tache_id: "OLD",\n      date: "2026-08-31", duree: 3, resource_ids: ["R1"],\n    }],\n    horizonDays: 2,\n  });\n  assert.equal(out.allocations_proposees.length, 1);\n  assert.equal(out.allocations_proposees[0].date, "2026-09-01");\n  assert.equal(out.allocations_proposees[0].duree, 5);\n}\n\n// 19. Déterminisme : mêmes entrées, même proposition bit-à-bit.\n'''
          s = s.replace(marker, test)
          s = s.replace('// 19. Explicabilité minimale obligatoire sur toute allocation proposée.', '// 20. Explicabilité minimale obligatoire sur toute allocation proposée.')
          s = s.replace('✓ Planning Engine V1 — 19 scénarios métier validés', '✓ Planning Engine V1 — 20 scénarios métier validés')
          p.write_text(s)
          PY
      - run: git diff --check
      - run: npm ci
      - run: node scripts/verif-planning-engine-v1.mjs
      - run: npm run build
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Renovation/planningEngineV1.js scripts/verif-planning-engine-v1.mjs
          git commit -m 'Corrige les garde-fous du moteur global V1'
          git push origin HEAD:feature/planning-engine-v1
