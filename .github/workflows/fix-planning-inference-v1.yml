name: Fix Planning Inference V1

on:
  push:
    branches: [feature/planning-model-v1]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[inference-fix-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/planning-model-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Corriger la priorité du lot électrique sur les ouvrages P/PC
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/Renovation/planningGroupInferenceV1.js')
          s = p.read_text()
          old = 'if (["E", "EG"].includes(pfx) || lot === "electricite") {'
          new = 'if (["E", "EG"].includes(pfx) || (lot === "electricite" && !["P", "PC"].includes(pfx))) {'
          if s.count(old) != 1:
              raise SystemExit(f'motif attendu une fois, trouvé {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
      - run: node scripts/verif-planning-model-v1.mjs
      - run: node scripts/verif-planning-group-inference-v1.mjs
      - run: npm ci
      - run: npm run build
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Renovation/planningGroupInferenceV1.js
          git commit -m "Planning Model V1: priorise les règles plomberie [inference-fix-generated]"
          git push origin HEAD:feature/planning-model-v1
