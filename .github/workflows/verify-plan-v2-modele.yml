name: Verify Plan V2 — modèle de l'existant (nouvel éditeur de plans, tâche 1)

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/Renovation/planV2/**'
      - 'src/Renovation/releveImapper.mjs'
      - 'scripts/verif-plan-v2-modele.mjs'
      - 'scripts/fixtures/releve-imapper-reference*'
      - '.github/workflows/verify-plan-v2-modele.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Murs calculés à partir des pièces (partagés, périphériques, épaisseurs), ouvertures accrochées, rien de perdu, relevé non modifié
        run: node scripts/verif-plan-v2-modele.mjs
