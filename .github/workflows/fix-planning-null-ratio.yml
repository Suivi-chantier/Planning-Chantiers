name: Fix Planning Null Ratio

on:
  push:
    branches: [feature/planning-model-v1]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[null-ratio-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/planning-model-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Rendre les ratios manquants explicites
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/Renovation/planningModelV1.js')
          s = p.read_text()
          old = '''const num = v => {
            const n = Number(v);
            return Number.isFinite(n) ? n : null;
          };'''
          # indentation réelle au niveau racine
          old = old.replace('          ', '')
          new = '''const num = v => {
  if (v == null || (typeof v === "string" && v.trim() === "")) return null;
  const n = Number(v);
  return Number.isFinite(n) ? n : null;
};'''
          if s.count(old) != 1:
              raise SystemExit(f'Bloc num attendu une fois, trouvé {s.count(old)}')
          s = s.replace(old, new)
          old2 = '''    const r = num(st.ratio);
    if (r != null) ratioTotal += r;'''
          new2 = '''    const r = num(st.ratio);
    if (r == null) erreurs.push(`Sous-tâche ${n} sans ratio`);
    else ratioTotal += r;'''
          if s.count(old2) != 1:
              raise SystemExit(f'Bloc ratio attendu une fois, trouvé {s.count(old2)}')
          p.write_text(s)

          t = Path('scripts/verif-planning-model-v1.mjs')
          ts = t.read_text()
          marker = '''const bad = m.maturiteOuvrageV2(incomplet);
          assert.equal(bad.planifiable, false);'''.replace('          ','')
          insert = '''const bad = m.maturiteOuvrageV2(incomplet);
assert.equal(bad.planifiable, false);'''
          if marker not in ts:
              raise SystemExit('Marqueur fixture incomplet introuvable')
          # Ajout d'un ouvrage dont les ratios numériques totalisent déjà 100 malgré une tâche null.
          extra = '''
const ratioManquant = {
  id: "ratio-missing",
  identifiant: "ouvrages_v2_ratio-missing",
  libelle: "E-099 : Test ratio manquant",
  sous_taches: [
    { id: "st_r1", nom: "A", lotId: "electricite", groupe_type_id: "gt_reseau_elec", ratio: 100, dependance_mode: "parallel" },
    { id: "st_r2", nom: "B", lotId: "electricite", groupe_type_id: "gt_appareillage_elec", ratio: null, dependance_mode: "parallel" },
  ],
};
const missingRatio = m.maturiteOuvrageV2(ratioManquant);
assert.equal(missingRatio.planifiable, false);
assert.ok(missingRatio.erreurs.some(e => e.includes("sans ratio")));
'''
          anchor = '\nconsole.log("planningModelV1 fixtures: OK");'
          if ts.count(anchor) != 1:
              raise SystemExit('Anchor console fixture introuvable')
          ts = ts.replace(anchor, extra + anchor)
          t.write_text(ts)
          PY
      - run: node scripts/verif-planning-model-v1.mjs
      - run: node scripts/verif-planning-model-audit-v1.mjs
      - run: node scripts/verif-planning-group-inference-v1.mjs
      - run: node scripts/verif-planning-dependency-inference-v1.mjs
      - run: node scripts/verif-planning-eligibility-v1.mjs
      - run: npm ci
      - run: npm run build
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Renovation/planningModelV1.js scripts/verif-planning-model-v1.mjs
          git commit -m "Détecte explicitement les ratios V2 manquants [null-ratio-generated]"
          git push origin HEAD:feature/planning-model-v1
