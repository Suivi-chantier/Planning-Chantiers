name: Point du soir des conducteurs — notification C1 + C2 (18h30, jours ouvrés)

# Projet docs/projets/notifications-push.md, tâche 4.
# Chaque jour ouvré à 18h30 (Paris), UNE notification par personne qui résume
# les comptes rendus reçus, les ouvriers attendus qui n'en ont pas rendu (même
# règle que le mail de rappel) et les demandes de matériel en attente.
# Rien à signaler : rien. Interrupteur général coupé : send-push n'envoie rien
# (voulu, Loris l'active).
#
# Heure d'été / heure d'hiver : un cron GitHub est en UTC. Même technique que
# cron-push-materiaux.yml et cron-factures-a-emettre.yml, DEUX créneaux, et le
# job ignore tout appel avant 18h30 Paris (&pas_avant=18:30) :
#   16h30 UTC = 18h30 Paris en été   (17h30 en hiver : ignoré)
#   17h30 UTC = 18h30 Paris en hiver (19h30 en été : le point du jour est déjà
#                                     écrit, rien n'est renvoyé — clé C1-<date>)
# 18h30 est hors de la plage de silence (20h-7h) : l'envoi part tout de suite.
#
# Bouton « Run workflow » : case « simulation » cochée par défaut → aucun envoi,
# aucune écriture, réponse = qui aurait reçu quoi. Date facultative (simulation
# seulement) pour simuler un autre jour.
#
# Secret requis : CRON_SECRET (déjà présent pour les autres crons GitHub).

on:
  schedule:
    - cron: '30 16 * * 1-5'    # Lun-Ven 16h30 UTC → 18h30 Paris (été)
    - cron: '30 17 * * 1-5'    # Lun-Ven 17h30 UTC → 18h30 Paris (hiver)
  workflow_dispatch:
    inputs:
      simulation:
        description: "Simulation sans envoi ni écriture"
        type: boolean
        required: false
        default: true
      date:
        description: "Jour à simuler (AAAA-MM-JJ), simulation seulement. Vide = aujourd'hui."
        required: false
        default: ""

jobs:
  point:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron-dispatcher?job=point_conducteurs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          EVENEMENT: ${{ github.event_name }}
          SIMULATION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.simulation == 'true' }}
          DATE_SIMULEE: ${{ github.event.inputs.date }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret manquant"
            exit 1
          fi
          job="point_conducteurs"
          if [ "$EVENEMENT" = "schedule" ]; then
            job="$job&pas_avant=18:30"
          elif [ "$SIMULATION" = "true" ]; then
            job="$job&simulation=1"
            if [ -n "$DATE_SIMULEE" ]; then
              if ! echo "$DATE_SIMULEE" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
                echo "::error::Date attendue au format AAAA-MM-JJ : $DATE_SIMULEE"
                exit 1
              fi
              job="$job&date=$DATE_SIMULEE"
            fi
          elif [ -n "$DATE_SIMULEE" ]; then
            echo "::error::La date ne s'utilise qu'en simulation"
            exit 1
          fi
          response=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://planning-chantiers.vercel.app/api/cron-dispatcher?job=$job")
          status=$(echo "$response" | grep -oE 'HTTP_STATUS:[0-9]+' | cut -d: -f2)
          body=$(echo "$response" | sed 's/HTTP_STATUS:[0-9]*$//')
          echo "Status: $status"
          echo "Body  : $body"
          if [ "$status" != "200" ]; then
            echo "::error::Le dispatcher a renvoyé un statut non-200"
            exit 1
          fi
          # Le dispatcher répond 200 même quand la tâche échoue : il range
          # l'erreur dans son résumé. On la fait remonter.
          if echo "$body" | grep -q '"error":'; then
            echo "::error::Le point du soir a échoué — voir le corps de la réponse"
            exit 1
          fi
          if echo "$body" | grep -qE '"echecs":[1-9]'; then
            echo "::warning::Au moins un envoi a échoué — voir le corps de la réponse"
          fi
