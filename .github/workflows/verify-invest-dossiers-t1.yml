name: Verify Invest Dossiers T1

on:
  pull_request:
    paths:
      - 'supabase/migrations/20260930190000_invest_dossiers_tranche1.sql'
      - 'sql/202609_invest_dossiers_tranche1_rollback.sql'
      - 'supabase/migrations/20260930210000_invest_dossiers_tranche2a.sql'
      - 'sql/202609_invest_dossiers_tranche2a_rollback.sql'
      - 'supabase/migrations/20260930230000_invest_situation_patrimoniale_2c.sql'
      - 'sql/202609_invest_situation_patrimoniale_2c_rollback.sql'
      - 'src/Invest/dossiers/**'
      - 'src/Invest/annuaire.mjs'
      - 'src/Invest/CRM.jsx'
      - 'src/Invest/Dashboard.jsx'
      - 'src/Invest/tableauBord.mjs'
      - 'src/Invest/Prospection.jsx'
      - 'src/Invest/Structuration.jsx'
      - 'api/_cron/cron-invest-tableau-bord.js'
      - 'scripts/verif-invest-pilotage-2b.mjs'
      - 'scripts/verif-invest-copilote-2b.mjs'
      - 'api/_ia/invest/**'
      - 'api/_ia/taches/invest_copilot.js'
      - 'scripts/verif-tableau-bord.mjs'
      - 'scripts/verif-invest-dossiers-t1.mjs'
      - 'scripts/reprise-invest-dossiers-t1.mjs'
      - '.github/workflows/verify-invest-dossiers-t1.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PostgreSQL embarqué (PGlite, sans modifier package.json)
        run: npm install --no-save --no-package-lock @electric-sql/pglite@0.5.8
      - name: Dossier Invest — Tranches 1, 2a et 2c (dossiers, parcours, journal, reprise, pilotage, situation patrimoniale)
        run: node scripts/verif-invest-dossiers-t1.mjs
      - name: Dossier Invest — Tranche 2b (pilotage CRM, tableau de bord, Morning Routine)
        run: node scripts/verif-invest-pilotage-2b.mjs
      - name: Tableau de bord Invest et mail du matin
        run: node scripts/verif-tableau-bord.mjs
      - name: Copilote Invest sur le Dossier Invest (Tranche 2b-bis)
        run: node scripts/verif-invest-copilote-2b.mjs
