name: Patch CellModal Resource Capacity V1

on:
  push:
    branches:
      - feature/planning-resources-v1
    paths:
      - 'scripts/patch-cellmodal-resource-capacity-v1.mjs'
      - '.github/workflows/patch-cellmodal-resource-capacity-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Raccorde CellModal aux capacités Ressources V1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Appliquer le patch contrôlé
        run: node scripts/patch-cellmodal-resource-capacity-v1.mjs
      - name: Fixtures ressources
        run: node scripts/verif-planning-resource-model-v1.mjs
      - name: Fixtures capacité
        run: node --experimental-default-type=module scripts/verif-planning-resource-capacity-v1.mjs
      - name: Installer les dépendances
        run: npm ci
      - name: Compiler l'application
        run: npm run build
      - name: Vérifier le diff
        run: git diff --check
      - name: Committer le raccordement
        run: |
          git config user.name "Suivi-chantier"
          git config user.email "suivi.chantier@groupe-profero.com"
          git add src/Renovation/CellModal.jsx
          if git diff --cached --quiet; then
            echo "Aucun changement à committer"
          else
            git commit -m "Raccorde CellModal aux capacités Ressources V1"
            git push
          fi
