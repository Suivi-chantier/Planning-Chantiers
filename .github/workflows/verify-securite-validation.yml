name: Verify Fiche sécurité (validation, signatures, versions)

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/Renovation/securite/**'
      - 'src/Renovation/securiteValidation.mjs'
      - 'src/Renovation/securiteValidation.js'
      - 'src/Renovation/securiteVersion.mjs'
      - 'src/Renovation/securiteVersion.js'
      - 'src/Renovation/securiteFiche.mjs'
      - 'src/Renovation/securitePastilles.mjs'
      - 'src/Renovation/securiteDonnees.js'
      - 'src/Renovation/storageChantier.js'
      - 'src/Renovation/FicheSecuriteChantier.jsx'
      - 'src/Renovation/FicheSecuriteOperation.jsx'
      - 'src/Renovation/SignatureFicheSecurite.jsx'
      - 'src/access.js'
      - 'supabase/migrations/*securite_fiches*'
      - 'scripts/verif-securite-validation.mjs'
      - '.github/workflows/verify-securite-validation.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fiche sécurité — règles de validation, amiante, empreinte canonique, signatures (modules purs, exemples fictifs)
        run: node scripts/verif-securite-validation.mjs
