name: Synthèse de la semaine — notification D3 (lundi 8h30)

# Projet docs/projets/notifications-push.md, tâche 8.
# Chaque lundi matin, le serveur calcule le bandeau du Bilan semaine de la
# semaine écoulée (production, marge de la période, heures validées) avec les
# fonctions de l'écran (src/Renovation/bilanPeriodeV3.mjs), à partir des
# relevés journaliers, et envoie un push court vers le Bilan semaine (admins
# par défaut). Les relevés du dimanche sont écrits la veille à 23h45 Paris
# (cron-releves-journaliers.yml). Relevé absent : la notification dit
# « relevé pas encore disponible », jamais un chiffre à 0.
#
# Heure d'été / heure d'hiver : DEUX créneaux, et le job ignore tout appel
# avant 8h Paris (&pas_avant=8) :
#   06h30 UTC = 08h30 Paris en été   (07h30 en hiver : ignoré)
#   07h30 UTC = 08h30 Paris en hiver (09h30 en été : aucun doublon, une seule
#                                     notification par semaine)
#
# Bouton « Run workflow » : simulation cochée (par défaut) = texte et
# destinataires, sans rien envoyer ni écrire. Semaine facultative (AAAA-Www).
#
# Secret requis : CRON_SECRET (déjà présent pour les autres crons GitHub).

on:
  schedule:
    - cron: '30 6 * * 1'       # Lundi 06h30 UTC → 08h30 Paris (été)
    - cron: '30 7 * * 1'       # Lundi 07h30 UTC → 08h30 Paris (hiver)
  workflow_dispatch:
    inputs:
      simulation:
        description: "Simulation sans envoi ni écriture"
        type: boolean
        required: false
        default: true
      semaine:
        description: "Semaine à simuler (AAAA-Www), vide = semaine écoulée"
        type: string
        required: false
        default: ""

jobs:
  synthese:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron-dispatcher?job=synthese_semaine
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          EVENEMENT: ${{ github.event_name }}
          SIMULATION: ${{ github.event.inputs.simulation }}
          SEMAINE: ${{ github.event.inputs.semaine }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret manquant"
            exit 1
          fi
          if [ "$EVENEMENT" = "schedule" ]; then
            job="synthese_semaine&pas_avant=8"
          elif [ "$SIMULATION" = "true" ]; then
            job="synthese_semaine&simulation=1"
          else
            job="synthese_semaine"
          fi
          if [ "$EVENEMENT" != "schedule" ] && echo "$SEMAINE" | grep -qE '^[0-9]{4}-W[0-9]{2}$'; then
            job="$job&semaine=$SEMAINE"
          fi
          response=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://planning-chantiers.vercel.app/api/cron-dispatcher?job=$job")
          status=$(echo "$response" | grep -oE 'HTTP_STATUS:[0-9]+' | cut -d: -f2)
          body=$(echo "$response" | sed 's/HTTP_STATUS:[0-9]*$//')
          echo "Status: $status"
          echo "Body  : $body"
          if [ "$status" != "200" ]; then
            echo "::error::Le dispatcher a renvoyé un statut non-200"
            exit 1
          fi
          if echo "$body" | grep -q '"error":'; then
            echo "::error::Le job « synthèse de la semaine » a échoué — voir le corps de la réponse"
            exit 1
          fi
