name: Verify Admin Users

on:
  pull_request:
    paths:
      - 'supabase/functions/admin-users/**'
      - 'supabase/config.toml'
      - 'scripts/verif-admin-users.mjs'
      - '.github/workflows/verify-admin-users.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: admin-users fermée par défaut (admin actif uniquement)
        run: node scripts/verif-admin-users.mjs
