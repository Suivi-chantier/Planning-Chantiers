name: Verify Fiche sécurité (PDF)

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/Renovation/securite/**'
      - 'src/Renovation/securitePdf.mjs'
      - 'src/Renovation/securitePdf.js'
      - 'src/Renovation/securitePdfRendu.js'
      - 'src/Renovation/securiteVersion.mjs'
      - 'src/Renovation/securiteValidation.mjs'
      - 'src/Renovation/securitePastilles.mjs'
      - 'src/Renovation/charteDocProfero.mjs'
      - 'src/Renovation/securiteDonnees.js'
      - 'src/Renovation/storageChantier.js'
      - 'src/Renovation/FicheSecuriteChantier.jsx'
      - 'src/access.js'
      - 'scripts/verif-securite-pdf.mjs'
      - '.github/workflows/verify-securite-pdf.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fiche sécurité — mise en page du PDF (ordre des sections, cases cochées, signatures, pied de page ; module pur, exemples fictifs)
        run: node scripts/verif-securite-pdf.mjs
